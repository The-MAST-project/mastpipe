name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Format check
        run: ruff format --check src tests scripts
      - name: Privacy scan
        run: python scripts/privacy_scan.py
      - name: Test
        run: pytest

  fleet:
    # Checks mastpipe.vocab against the fleet's shared library MAST_common, checked
    # out as a sibling folder named `common` (the package name the fleet imports it
    # under), with the workspace root on PYTHONPATH. A branch of the same name in
    # MAST_common is used when it exists, so paired changes are tested together;
    # otherwise master. MASTPIPE_FLEET_CHECK=1 turns a missing `common` into an
    # error, so the job cannot pass by skipping.
    name: Fleet vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mastpipe
      - name: Resolve the paired MAST_common branch
        id: common-ref
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/The-MAST-project/MAST_common.git "refs/heads/$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: The-MAST-project/MAST_common
          ref: ${{ steps.common-ref.outputs.ref }}
          path: common
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # pydantic for common.spec, rich for common.utils (via common.mast_logging).
        run: python -m pip install -e "./mastpipe[dev]" pydantic rich
      - name: Test
        working-directory: mastpipe
        env:
          PYTHONPATH: ${{ github.workspace }}
          MASTPIPE_FLEET_CHECK: "1"
        run: python -m pytest tests/fleet -q -ra

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[docs]"
      - name: Build (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
