[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mastpipe"
description = "Data-reduction pipeline for the MAST fiber-fed spectrographs (HighSpec, DeepSpec)"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
authors = [{ name = "The MAST project" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "astropy>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "nbstripout",
]
pypeit = [
    "pypeit>=2.0",
]

[project.scripts]
mastpipe = "mastpipe.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mastpipe = [
    "instruments/**/*.yaml",
    "instruments/**/*.csv",
]

[tool.setuptools.dynamic]
version = { attr = "mastpipe.__version__.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["mastpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
    "slow: end-to-end runs on simulated nights and the laboratory regression (minutes); selected by default",
]
