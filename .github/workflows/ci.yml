name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the run still in progress for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Formatting first, then the rules, as the MAST fleet's CI does. Only ruff is
    # installed, at the version pinned in the `dev` extra: formatter output can differ
    # between ruff versions. The pin is read from pyproject.toml, so it lives in one
    # place, without installing the package and its scientific dependencies.
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: |
          spec=$(python -c 'import re, tomllib; dev = tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["dev"]; print(next(r for r in dev if re.split(r"[^A-Za-z0-9_.-]", r)[0] == "ruff"))')
          python -m pip install "$spec"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Privacy scan
        run: python scripts/privacy_scan.py
      - name: Test
        run: pytest

  fleet:
    # Checks mastpipe.vocab against the fleet's shared library MAST_common, checked
    # out as a sibling folder named `common` (the package name the fleet imports it
    # under), with the workspace root on PYTHONPATH. A branch of the same name in
    # MAST_common is used when it exists, so paired changes are tested together;
    # otherwise master. MASTPIPE_FLEET_CHECK=1 turns a missing `common` into an
    # error, so the job cannot pass by skipping.
    name: Fleet vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mastpipe
      - name: Resolve the paired MAST_common branch
        id: common-ref
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        # `--exit-code` makes ls-remote exit with 2 when the ref does not exist; any
        # other failure (network, authentication) fails the job rather than silently
        # testing against master.
        run: |
          status=0
          git ls-remote --exit-code --heads https://github.com/The-MAST-project/MAST_common.git "refs/heads/$BRANCH" > /dev/null || status=$?
          case "$status" in
            0) echo "ref=$BRANCH" >> "$GITHUB_OUTPUT" ;;
            2) echo "ref=master" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::git ls-remote failed with exit status $status"; exit "$status" ;;
          esac
      - uses: actions/checkout@v4
        with:
          repository: The-MAST-project/MAST_common
          ref: ${{ steps.common-ref.outputs.ref }}
          path: common
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # pydantic for common.spec, rich for common.utils (via common.mast_logging).
        run: python -m pip install -e "./mastpipe[dev]" pydantic rich
      - name: Test
        working-directory: mastpipe
        env:
          PYTHONPATH: ${{ github.workspace }}
          MASTPIPE_FLEET_CHECK: "1"
        run: python -m pytest tests/fleet -q -ra

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[docs]"
      - name: Build (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
